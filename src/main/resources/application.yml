spring:
  application:
    name: portfolio-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: ${COOKIE_SAME_SITE:none}
app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
  admin:
    bootstrap-username: ${ADMIN_USERNAME:admin}
    bootstrap-password: ${ADMIN_PASSWORD:ChangeMe123!}
    bootstrap-display-name: ${ADMIN_DISPLAY_NAME:Portfolio Admin}
    allowed-ips: ${ADMIN_ALLOWED_IPS:}
  guest:
    cookie-secret: ${GUEST_COOKIE_SECRET:default-guest-secret-token-change-in-production}
