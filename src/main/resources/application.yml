spring:
  application:
    name: portfolio-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: ${COOKIE_SAME_SITE:none}
app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
  admin:
    bootstrap-username: ${ADMIN_USERNAME:admin}
    bootstrap-password: ${ADMIN_PASSWORD:}
    bootstrap-display-name: ${ADMIN_DISPLAY_NAME:Portfolio Admin}
    allowed-ips: ${ADMIN_ALLOWED_IPS:}
  guest:
    cookie-secret: ${GUEST_COOKIE_SECRET:}
  mail:
    recipient: ${NOTIFY_EMAIL:nguyenquockhoa5549@gmail.com}
    enabled: ${MAIL_ENABLED:true}
    resend-api-key: ${RESEND_API_KEY:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  chatbot:
    url: ${CHATBOT_SERVICE_URL:http://localhost:8000}
    internal-secret: ${CHATBOT_INTERNAL_SECRET:}


